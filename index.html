<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eid Mubarak</title>

<meta property="og:title" content="✨ Eid Mubarak ✨">
<meta property="og:description" content="Special Eid Greeting For You 🌙">
<meta property="og:image" content="./762616c8fea72d938be5be8c582e4b63.jpg">
<meta property="og:type" content="website">

<style>

body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;

background:url('./762616c8fea72d938be5be8c582e4b63.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
overflow:hidden;
}

.container{
width:100%;
padding:20px;
}

h1{
font-size:60px;
color:#FFD700;
font-style:italic;
text-shadow:0 0 20px gold;
margin-bottom:10px;
animation: glow 2s infinite alternate;
}

.moon{
font-size:80px;
margin-bottom:20px;
animation: float 2s infinite ease-in-out;
}

p{
font-size:35px;
color:white;
font-style:italic;
font-weight:bold;
line-height:1.3;
text-shadow:0 0 15px black;
margin-bottom:40px;
}

#resultName{
    color:#00ffe5;
    font-size:45px;
    font-style:italic;
    text-shadow:0 0 15px black;
    margin-top:30px;

}

input{
width:80%;
max-width:380px;
padding:18px;
border:none;
border-radius:40px;
outline:none;
font-size:22px;
text-align:center;
font-style:italic;
margin-bottom:20px;
}

button{
padding:18px 35px;
border:none;
border-radius:40px;
background:#25D366;
color:white;
font-size:22px;
font-style:italic;
cursor:pointer;
box-shadow:0 0 20px #25D366;
margin:10px;
}

.watermark{
position:fixed;
bottom:15px;
right:15px;
font-size:22px;
color:white;
font-style:italic;
text-shadow:0 0 10px black;
}

@keyframes glow{
from{
text-shadow:0 0 10px gold;
}
to{
text-shadow:0 0 30px white;
}
}

@keyframes float{
0%{
transform:translateY(0px);
}
50%{
transform:translateY(-10px);
}
100%{
transform:translateY(0px);
}
}

@keyframes zoom{
from{
transform:scale(0);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

</style>
</head>

<body>

<div class="container">

<h1>Eid Mubarak</h1>

<div class="moon">🌙</div>

<p>
May Allah bless you and your family
</p>

<input type="text" id="nameInput" placeholder="Apna Naam Likho">

<br>

<div id="resultName"></div>

<button onclick="showName()">
Eid Mubarak
</button>

<button onclick="shareWhatsApp()">
Share on WhatsApp
</button>

<div id="showName"></div>

</div>

<div class="watermark">
@itz.dark.soul2026
</div>

<script>

function showName(){

let name = document.getElementById("nameInput").value;

if(name==""){
alert("Pehle Naam Likho");
return;
}

document.getElementById("resultname").innerHTML =
"✨ Eid Mubarak " + name + " ✨";

}

function shareWhatsApp(){

let name = document.getElementById("nameInput").value;

if(name==""){
alert("Pehle Naam Likho");
return;
}

let msg =
"✨ Eid Mubarak ✨\n\n" +
"🌙 May Allah bless you and your family 🌙\n\n" +
"From : " + name + "\n\n" +
window.location.href;

let url =
"https://wa.me/?text=" + encodeURIComponent(msg);

window.open(url,'_blank');

}

</script>

</body>
</html>
