<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eid Mubarak</title>

<style>

body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;
color:white;

background:url('https://i.imgur.com/abc123.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.container{
background:rgba(0,0,0,0.35);
padding:20px;
border-radius:20px;
width:90%;
max-width:400px;
}

h1{
font-size:55px;
color:gold;
text-shadow:0 0 20px gold;
margin-bottom:10px;
}

p{
font-size:28px;
font-style:italic;
text-shadow:0 0 10px black;
}

input{
padding:12px;
width:220px;
border:none;
border-radius:25px;
font-size:18px;
outline:none;
text-align:center;
margin-top:20px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#25D366;
color:white;
font-size:20px;
cursor:pointer;
box-shadow:0 0 20px #25D366;
}

#userName{
margin-top:20px;
font-size:35px;
font-weight:bold;
color:#fff;
text-shadow:0 0 15px black;
}

.watermark{
position:fixed;
bottom:10px;
right:15px;
font-size:20px;
color:white;
opacity:0.8;
font-style:italic;
}

</style>
</head>

<body>

<div class="container">

<h1>Eid Mubarak 🌙</h1>

<p>May Allah bless you and your family</p>

<input type="text" id="nameInput" placeholder="Apna Naam Likho">

<br>

<button onclick="saveName()">
Generate Wish
</button>

<div id="userName"></div>

</div>

<div class="watermark">
@itz.dark.soul2026
</div>

<script>

function saveName(){

let user =
document.getElementById("nameInput").value;

if(user==""){
alert("Naam likho 😊");
return;
}

document.getElementById("userName").innerHTML =
"✨ Eid Mubarak " + user + " ✨";

}

</script>

</body>
</html>
