<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eid Mubarak</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    background:url('762616c8fea72d938be5be8c582e4b63.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    font-family:Arial;
    text-align:center;
    overflow:hidden;
}

.container{
    padding-top:70px;
}

h1{
    color:gold;
    font-size:75px;
    font-style:italic;
    text-shadow:0 0 20px gold;
    margin-bottom:10px;
}

.moon{
    font-size:120px;
    color:gold;
    margin-top:-40px;
    text-shadow:0 0 20px orange;
}

p{
    color:white;
    font-size:45px;
    font-style:italic;
    text-shadow:0 0 15px black;
    margin-top:-20px;
}

input{
    width:80%;
    padding:18px;
    border:none;
    border-radius:50px;
    font-size:35px;
    text-align:center;
    margin-top:30px;
    outline:none;
    font-style:italic;
}

button{
    margin-top:35px;
    padding:18px 40px;
    border:none;
    border-radius:50px;
    background:#25D366;
    color:white;
    font-size:35px;
    font-style:italic;
    cursor:pointer;
    box-shadow:0 0 25px #25D366;
}

#resultName{
    margin-top:40px;
    color:#00ffe5;
    font-size:55px;
    font-style:italic;
    text-shadow:0 0 20px black;
}

.watermark{
    position:fixed;
    bottom:15px;
    right:15px;
    color:white;
    font-size:28px;
    font-style:italic;
    text-shadow:0 0 10px black;
}

@media(max-width:600px){

h1{
    font-size:45px;
}

.moon{
    font-size:80px;
}

p{
    font-size:28px;
}

input{
    font-size:25px;
}

button{
    font-size:25px;



}

</style>
</head>

<body>

<div class="container">

<h1>Eid Mubarak</h1>

<div class="moon">🌙</div>

<p>May Allah bless you and your family</p>

<input type="text" id="nameInput" placeholder="Naam Likho">

<br>
    <div id="resultName"></div>

<button onclick="shareWhatsApp ()">
Share on WhatsApp
</button>



</div>

<div class="watermark">
@itz.dark.soul2026
</div>

<script>

function shareWhatsApp(){

let name = document.getElementById("nameInput").value;

if(name==""){
alert("Apna naam likho");
return;
}

document.getElementById("resultName").innerHTML =
"✨ Eid Mubarak " + name + " ✨";
let msg =
"✨ Eid Mubarak " + name + " ✨\n\n" +
window.location.href;

window.open(
"https://wa.me/?text=" + encodeURIComponent(msg),
"_blank"
);

}

</script>
</body>
</html>
