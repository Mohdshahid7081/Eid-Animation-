<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="✨ Eid Mubarak ✨">
<meta property="og:description" content="Special Greeting For You 🌙">
<meta property="og:image" content="https://chat.openai.com/c/6d0d1a6c626845ab4e36d127173f03af.jpg">
<meta property="og:url" content="https://mohdshahid7081.github.io/Eid-Animation-/">
<meta property="og:type" content="website">
<title>Eid Mubarak</title>

<style>

body{
    background:url('https://i.imgur.com/abc123.jpg');
    
}

.container{
    animation:fade 2s ease;
}

h1{
    font-size:55px;
    color:gold;
    text-shadow:0 0 20px gold;
    animation:glow 2s infinite alternate;
}

p{
    font-size:25px;
}

#userName{
    color:#00ffcc;
    font-size:35px;
    margin-top:10px;
}

button{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:40px;
    background:#25D366;
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 20px #25D366;
}

.watermark{
    position:fixed;
    bottom:10px;
    right:15px;
    color:white;
    opacity:0.7;
    font-size:18px;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px gold;
    }
    to{
        text-shadow:0 0 30px white;
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

</style>
</head>

<body>

<div class="container">

<h1>Eid Mubarak 🌙</h1>

<p>May Allah bless you and your family</p>

<div id="userName"></div>

<button onclick="shareWhatsApp()">
Share on WhatsApp
</button>

</div>

<div class="watermark">
  <i>
@itz.dark.soul2026
  </i>
</div>


<script>
function saveName(){
  let user = document.getElementById("nameInput").value;

  if(user==""){
    alert("Naam likho 😄");
    return;
  }

  document.getElementById("userName").innerHTML =
    "✨ Eid Mubarak, " + user + " ✨";

  document.getElementById("nameBox").style.display="none";
}

function shareWhatsApp(){
  let text =
  "✨ Eid Mubarak ✨\nVisit this greeting:\n" + window.location.href;

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(text),
    "_blank"
  );
}
</script>

</body>
</html>
