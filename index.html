<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Georgia, serif;
    text-align:center;
    color:white;

    background:url('762616c8fea72d938be5be8c582e4b63.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
}

.overlay{
    background:rgba(0,0,0,0.35);
    min-height:100vh;
    padding-top:60px;
}

h1{
    color:gold;
    font-size:70px;
    font-style:italic;
    text-shadow:0 0 20px gold;
    margin-bottom:10px;
}

.moon{
    font-size:100px;
    color:#ffcc00;
    margin-top:-30px;
}

.line{
    font-size:42px;
    font-style:italic;
    text-shadow:0 0 15px black;
    margin:20px;
}

input{
    width:80%;
    max-width:500px;
    padding:20px;
    border:none;
    border-radius:50px;
    font-size:28px;
    text-align:center;
    font-style:italic;
    margin-top:20px;
}

.username{
    font-size:55px;
    color:cyan;
    font-style:italic;
    margin-top:40px;
    text-shadow:0 0 15px cyan;
}

button{
    margin-top:30px;
    padding:20px 50px;
    border:none;
    border-radius:50px;
    background:#25D366;
    color:white;
    font-size:30px;
    font-style:italic;
    box-shadow:0 0 25px #25D366;
}

.watermark{
    margin-top:80px;
    font-size:30px;
    font-style:italic;
    color:white;
}
</style>
</head>

<body>

<div class="overlay">

<h1>Eid Mubarak</h1>

<div class="moon">🌙</div>

<div class="line">
May Allah bless you and your family
</div>

<input type="text" id="name" placeholder="Naam Likho">

<div class="username" id="showName">
✨ Eid Mubarak ✨
</div>

<button onclick="shareNow()">
Share on WhatsApp
</button>

<div class="watermark">
@itz.dark.soul2026
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const user = params.get("name");

if(user){
    document.getElementById("showName").innerHTML =
    "✨ Eid Mubarak " + user + " ✨";

    document.getElementById("name").value = user;
}

document.getElementById("name").addEventListener("input", function(){
    let value = this.value;

    if(value==""){
        document.getElementById("showName").innerHTML =
        "✨ Eid Mubarak ✨";
    }else{
        document.getElementById("showName").innerHTML =
        "✨ Eid Mubarak " + value + " ✨";
    }
});

function shareNow(){

let name = document.getElementById("name").value;

if(name==""){
alert("Pehle naam likho");
return;
}

let link = "https://mohdshahid7081.github.io/Eid-Animation-/?name=" + encodeURIComponent(name);

let message = "✨ Eid Mubarak " + name + " ✨\n\n" + link;

window.open(
"https://wa.me/?text=" + encodeURIComponent(message),
"_blank"
);

}
</script>

</body>
</html>
