<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eid Mubarak</title>

<style>

body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;
color:white;

background:url('8a5b46f1a38ae4760a54f6cd6a0c4076.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
overflow:hidden;
}

.container{
width:100%;
padding-top:40px;
}

input{
padding:10px;
width:180px;
border:none;
border-radius:20px;
font-size:18px;
text-align:center;
outline:none;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#25D366;
color:white;
font-size:20px;
margin-left:10px;
cursor:pointer;
box-shadow:0 0 20px #25D366;
}

#userName{
margin-top:20px;
font-size:35px;
font-weight:bold;
color:white;
text-shadow:0 0 10px black;
}

</style>
</head>

<body>

<div class="container">

<h1>Eid Mubarak 🌙</h1>

<p>May Allah bless you and your family</p>

<input type="text" id="nameInput" placeholder="Apna Naam Likho">

<br>

<button onclick="saveName()">
Generate Wish
</button>

<div id="userName"></div>

</div>

<div class="watermark">
@itz.dark.soul2026
</div>

<script>

function saveName(){

let user =
document.getElementById("nameInput").value;

if(user==""){
alert("Naam likho 😊");
return;
}

document.getElementById("userName").innerHTML =
"✨ Eid Mubarak " + user + " ✨";

}

</script>

</body>
</html>
